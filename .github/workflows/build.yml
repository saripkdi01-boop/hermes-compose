name: Build Hermes Compose
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # android-actions/setup-android@v3 gagal di CI karena sdkmanager
      # --licenses meminta input interaktif (y/N). Runner ubuntu-latest
      # sudah membawa Android SDK preinstalled: pakai itu + terima
      # lisensi non-interaktif via `yes |`.
      - name: Setup Android SDK (preinstalled)
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build release + unit tests
        run: gradle :app:assembleRelease :app:testReleaseUnitTest --no-daemon
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-compose-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
      # Pipeline tanda tangan dipisah: CI hanya memproduksi APK unsigned
      # lalu menempelkannya ke draft release. Tanda tangan dilakukan
      # maintainer di Muse dengan keystore lokal — kunci tidak pernah
      # masuk CI, tidak jadi secret, tidak bisa bocor lewat log runner.
      - name: Resolve versi
        id: ver
        run: |
          VNAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VCODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VNAME" ] || [ -z "$VCODE" ]; then
            echo "::error::gagal baca versionName/versionCode dari app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
      - name: Tempel APK unsigned ke draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.name }}
      run: |
          # Pitfall 2026-10-25 (run #145): langkah ini jalan di bash -e, jadi bila rilis $TAG belum ada, gh gagal dan shell mati SEBELUM mencapai cabang skip di bawah. || echo "" membuat rilis yang hilang = IS_DRAFT kosong = skip.
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "")
            if [ "$IS_DRAFT" != "true" ]; then
            echo "Draft release $TAG belum ada atau sudah publish — skip upload."
            exit 0
          fi
          gh release upload "$TAG" \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            --clobber --name app-release-unsigned.apk
          echo "APK unsigned (versionCode=${{ steps.ver.outputs.code }}) nempel di $TAG"
