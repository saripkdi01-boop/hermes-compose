name: Build Hermes Compose
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # android-actions/setup-android@v3 gagal di CI karena sdkmanager
      # --licenses meminta input interaktif (y/N). Runner ubuntu-latest
      # sudah membawa Android SDK preinstalled: pakai itu + terima
      # lisensi non-interaktif via `yes |`.
      - name: Setup Android SDK (preinstalled)
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build release + unit tests
        run: gradle :app:assembleRelease :app:testReleaseUnitTest --no-daemon
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-compose-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
