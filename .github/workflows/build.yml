name: build-gate
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew assembleDebug --stacktrace
